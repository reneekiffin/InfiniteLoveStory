<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="currentColor"
     aria-hidden="true">
  <!-- Wax seal — outer + inner ring + ILS monogram + est. 2025 + tiny stars. -->
  <circle cx="60" cy="60" r="54" stroke="currentColor" stroke-width="1" opacity="0.45"/>
  <circle cx="60" cy="60" r="46" stroke="currentColor" stroke-width="1" opacity="0.65"/>
  <circle cx="60" cy="60" r="44" stroke-dasharray="0.6 4" stroke="currentColor" stroke-width="0.6"/>

  <text x="60" y="62" text-anchor="middle"
        font-family="Italiana, Didot, serif"
        font-size="28"
        letter-spacing="1.5"
        fill="currentColor" stroke="none">ILS</text>

  <text x="60" y="84" text-anchor="middle"
        font-family="Cormorant Garamond, serif"
        font-style="italic"
        font-size="9.5"
        fill="currentColor" stroke="none">est. 2025</text>

  <!-- tiny star flanks -->
  <g stroke="currentColor" stroke-width="0.8" stroke-linecap="round">
    <path d="M22 60 v 4 M 20 62 h 4"/>
    <path d="M98 60 v 4 M 96 62 h 4"/>
  </g>
</svg>
