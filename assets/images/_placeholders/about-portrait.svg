<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="Placeholder: About — vertical portrait of Shane">
  <defs>
    <pattern id="dots-about-portrait" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.7" fill="#b8956a" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="300" height="400" fill="#f3ede2"/>
  <rect width="300" height="400" fill="url(#dots-about-portrait)"/>

  <!-- thin frame -->
  <rect x="20" y="20" width="260" height="360"
        fill="none" stroke="#b8956a" stroke-width="1" opacity="0.45"/>

  <!-- inner ornament: heart-line motif -->
  <g transform="translate(150 160)" opacity="0.6">
    <path d="M0 18 C -22 -8, -36 6, 0 30 C 36 6, 22 -8, 0 18 Z"
          fill="none" stroke="#b8956a" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- label -->
  <text x="150" y="230"
        text-anchor="middle"
        font-family="Cormorant Garamond, Georgia, serif"
        font-style="italic" font-weight="300"
        font-size="32"
        fill="#6b6357">About — vertical portrait of Shane</text>

  <!-- slot id (small caption) -->
  <text x="150" y="364"
        text-anchor="middle"
        font-family="Cinzel, serif" font-weight="700"
        font-size="14" letter-spacing="3"
        fill="#b8956a" opacity="0.7">about-portrait</text>
</svg>
