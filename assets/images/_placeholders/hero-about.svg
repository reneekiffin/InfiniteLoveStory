<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="Placeholder: About hero — Shane behind the camera">
  <defs>
    <pattern id="dots-hero-about" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.7" fill="#b8956a" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#f3ede2"/>
  <rect width="1600" height="900" fill="url(#dots-hero-about)"/>

  <!-- thin frame -->
  <rect x="20" y="20" width="1560" height="860"
        fill="none" stroke="#b8956a" stroke-width="1" opacity="0.45"/>

  <!-- inner ornament: heart-line motif -->
  <g transform="translate(800 410)" opacity="0.6">
    <path d="M0 18 C -22 -8, -36 6, 0 30 C 36 6, 22 -8, 0 18 Z"
          fill="none" stroke="#b8956a" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- label -->
  <text x="800" y="480"
        text-anchor="middle"
        font-family="Cormorant Garamond, Georgia, serif"
        font-style="italic" font-weight="300"
        font-size="32"
        fill="#6b6357">About hero — Shane behind the camera</text>

  <!-- slot id (small caption) -->
  <text x="800" y="864"
        text-anchor="middle"
        font-family="Cinzel, serif" font-weight="700"
        font-size="14" letter-spacing="3"
        fill="#b8956a" opacity="0.7">hero-about</text>
</svg>
